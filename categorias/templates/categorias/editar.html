<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editar Categoría - Juan del Sur</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    body {
        background: #f1f1f1;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* CARD PREMIUM UNIFICADO */
    .card-crear {
        width: 100%;
        max-width: 460px;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        border: 1px solid #eef2f5;
    }

    /* HEADER OSCURO COMERCIAL */
    .card-header-custom {
        padding: 18px 24px;
        background: #343a40;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: none;
    }

    .card-header-custom h5 {
        margin: 0;
        font-weight: bold;
        color: #ffffff;
        font-size: 1.1rem;
        letter-spacing: 0.3px;
    }

    /* BODY */
    .card-body {
        padding: 30px;
    }

    /* FORMULARIO */
    .form-label {
        font-weight: 600;
        color: #495057;
        font-size: 0.88rem;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .form-control {
        border-radius: 8px;
        padding: 11px 14px;
        border: 1px solid #ced4da;
        color: #212529;
        font-size: 0.95rem;
        background-color: #fff;
        transition: all 0.2s ease;
    }

    .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
    }

    /* BOTÓN ACTUALIZAR (AMARILLO IGUAL A LA TABLA) */
    .btn-actualizar {
        width: 100%;
        border: none;
        padding: 12px;
        border-radius: 8px;
        background: #ffc107;
        color: #212529;
        font-weight: 600;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(255, 193, 7, 0.2);
    }

    .btn-actualizar:hover {
        background: #e0a800;
    }

    /* BOTÓN CANCELAR PLANO */
    .btn-cancelar {
        display: block;
        margin-top: 12px;
        text-decoration: none;
        text-align: center;
        padding: 12px;
        border-radius: 8px;
        background: #6c757d;
        color: white;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .btn-cancelar:hover {
        background: #5c636a;
        color: white;
    }

    .btn-volver-top {
        background-color: rgba(255, 255, 255, 0.12);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s;
    }

    .btn-volver-top:hover {
        background-color: rgba(255, 255, 255, 0.22);
        color: #ffffff;
    }
</style>
</head>

<body>

<div class="card-crear">

  <div class="card-header-custom">
    <h5>
      <i class="fas fa-edit me-2 text-warning"></i>
      Editar Categoría
    </h5>

    <a href="{% url 'categorias:lista' %}" class="btn-volver-top">
      <i class="fas fa-arrow-left"></i>
    </a>
  </div>

  <div class="card-body">
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm mb-4" role="alert" style="border-radius:8px;">
                <i class="fas fa-exclamation-triangle me-2"></i>
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="mb-4">
        <label class="form-label">Nombre de la categoría</label>
        <input type="text" 
               name="nomCategoria" 
               class="form-control" 
               value="{{ categoria.nomCategoria }}" 
               placeholder="Ej. Bebidas, Limpieza..." 
               required>
      </div>

      <button type="submit" class="btn-actualizar">
        <i class="fas fa-save me-2"></i> Actualizar Categoría
      </button>

      <a href="{% url 'categorias:lista' %}" class="btn-cancelar">
        <i class="fas fa-times me-2"></i> Cancelar
      </a>

    </form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
