<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Usuario - Supermercado Juan Del Sur</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #0b0d11;
      background-image: radial-gradient(at 85% 15%, rgba(6,113,184,0.22) 0px, transparent 55%),
                        radial-gradient(at 15% 85%, rgba(13,148,136,0.15) 0px, transparent 55%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 40px 20px;
      margin: 0;
    }
    .register-container { max-width: 460px; width: 100%; }
    .register-card {
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 40px 35px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 10px 25px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.6);
    }
    .brand-section { margin-bottom: 26px; text-align: center; }
    .logo { max-height: 60px; margin-bottom: 12px; border-radius: 12px; }
    .brand-title { color: #0f172a; font-weight: 700; font-size: 1.35rem; }
    .brand-subtitle { color: #334155; font-size: 0.82rem; background: rgba(255,255,255,0.8); padding: 5px 14px; border-radius: 20px; display: inline-block; }
    .form-heading { color: #1e293b; font-weight: 600; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 10px; }
    .form-label { font-weight: 700; color: #475569; margin-bottom: 6px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .input-group-custom { position: relative; display: flex; align-items: center; }
    .input-group-custom .form-control, .input-group-custom .form-select {
      border-radius: 14px; padding: 12px 16px 12px 44px; border: 1px solid rgba(0,0,0,0.12);
      font-size: 0.92rem; background-color: rgba(255,255,255,0.7); width: 100%;
      transition: all 0.2s ease;
    }
    .input-group-custom .form-control:focus, .input-group-custom .form-select:focus {
      border-color: #0671B8;
      box-shadow: 0 0 0 4px rgba(6, 113, 184, 0.12);
      background-color: #ffffff;
    }
    
    .input-prefix-icon { position: absolute; left: 16px; color: #64748b; font-size: 1.05rem; pointer-events: none; z-index: 5; display: flex; align-items: center; }
    .form-switch-custom { background: rgb(255,255,255); padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.06); }
    
    .btn-main {
      background: linear-gradient(135deg, #0671B8 0%, #055a9a 100%);
      color: white; font-weight: 600; padding: 14px; border-radius: 14px; border: none;
      box-shadow: 0 6px 20px rgba(6,113,184,0.25);
      transition: all 0.2s ease;
    }
    .btn-main:hover { transform: translateY(-1px); filter: brightness(1.05); color: white; box-shadow: 0 8px 24px rgba(6,113,184,0.3); }
    .btn-main:active { transform: translateY(0); }
    
    .alert { border-radius: 14px; padding: 12px 16px; margin-bottom: 20px; }

    /* SECCIÓN MEJORADA DE ENLACES INFERIORES */
    .footer-links { 
      margin-top: 28px; 
      padding-top: 20px; 
      border-top: 1px solid rgba(0, 0, 0, 0.08); 
      text-align: center; 
    }
    .back-link {
      color: #475569;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 12px;
      transition: all 0.25s ease;
    }
    .back-link:hover {
      color: #0671B8;
      background-color: rgba(6, 113, 184, 0.08);
    }
    .back-link i {
      font-size: 1.1rem;
      transition: transform 0.25s ease;
      display: inline-block;
    }
    /* Animación fluida de la flecha apuntando a la izquierda */
    .back-link:hover i {
      transform: translateX(-4px);
    }
  </style>
</head>
<body>
<div class="register-container">
  <div class="card register-card">
    <div class="brand-section text-center">
      <img src="{% static 'usuarios/IMAGES/logoJuanDelSur.jpg' %}" class="logo" alt="Logo">
      <h2 class="brand-title">Supermercado Juan Del Sur</h2>
      <span class="brand-subtitle"><i class="bi bi-geo-alt-fill text-danger me-1"></i>Sucursal Los Pinos</span>
    </div>

    <h5 class="form-heading mb-3"><i class="bi bi-pencil-square me-2 text-primary"></i>Editar Funcionario</h5>

    {% if messages %}
      {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show">
          <i class="bi {% if message.tags == 'error' %}bi-exclamation-triangle-fill{% else %}bi-check-circle-fill{% endif %}"></i> {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <!-- Nombre -->
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <div class="input-group-custom">
          <input type="text" name="nom_usuario" class="form-control" required
                 value="{{ usuario.nom_usuario|default:'' }}" 
                 onkeypress="return soloLetras(event)">
          <span class="input-prefix-icon"><i class="bi bi-person"></i></span>
        </div>
      </div>

      <!-- Primer Apellido -->
      <div class="mb-3">
        <label class="form-label">Primer Apellido</label>
        <div class="input-group-custom">
          <input type="text" name="ap1" class="form-control" required
                 value="{{ usuario.ap1|default:'' }}"
                 onkeypress="return soloLetras(event)">
          <span class="input-prefix-icon"><i class="bi bi-person-vcard"></i></span>
        </div>
      </div>

      <!-- Segundo Apellido -->
      <div class="mb-3">
        <label class="form-label">Segundo Apellido</label>
        <div class="input-group-custom">
          <input type="text" name="ap2" class="form-control"
                 value="{{ usuario.ap2|default:'' }}"
                 onkeypress="return soloLetras(event)">
          <span class="input-prefix-icon"><i class="bi bi-person-vcard"></i></span>
        </div>
      </div>

      <!-- Correo Electrónico -->
      <div class="mb-3">
        <label class="form-label">Correo Electrónico</label>
        <div class="input-group-custom">
          <input type="email" name="email" class="form-control"
                 value="{{ usuario.email|default:'' }}"
                 placeholder="opcional - déjalo vacío para auto-generar">
          <span class="input-prefix-icon"><i class="bi bi-envelope-at"></i></span>
        </div>
        <small class="text-muted d-block mt-1" style="font-size: 0.78rem;">Si lo dejas vacío, se regenerará automáticamente en base a nombre y apellidos.</small>
      </div>

      <!-- Rol -->
      <div class="mb-3">
        <label class="form-label">Rol del Funcionario</label>
        <div class="input-group-custom">
          <select name="rol" class="form-select" required>
            <option value="">Seleccione un rol</option>
            {% for r in roles %}
              <option value="{{ r.id }}" {% if usuario.rol.id == r.id %}selected{% endif %}>
                {{ r.nom_rol }}
              </option>
            {% endfor %}
          </select>
          <span class="input-prefix-icon"><i class="bi bi-briefcase"></i></span>
        </div>
      </div>

      <!-- Estado (Activo/Inactivo) -->
      <div class="form-check form-switch form-switch-custom d-flex justify-content-between align-items-center mb-4">
        <label class="form-check-label fw-semibold text-secondary">
          <i class="bi bi-shield-check text-success me-1"></i> Usuario activo
        </label>
        <input class="form-check-input" type="checkbox" name="estado" 
               {% if usuario.estado %}checked{% endif %} style="width: 2.4em; height: 1.2em; cursor: pointer;">
      </div>

      <!-- Botón Guardar -->
      <button type="submit" class="btn btn-main w-100 mb-2">
        <i class="bi bi-check-circle-fill me-2"></i> Guardar Cambios
      </button>
    </form>

    <!-- BLOQUE INFERIOR CON EFECTO INTERACTIVO -->
    <div class="footer-links">
      <a href="{% url 'dashboard_admin' %}" class="back-link">
        <i class="bi bi-arrow-left"></i> Volver al Dashboard
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function soloLetras(event) {
    const key = event.key;
    const keyCode = event.keyCode;
    if ([8,9,13,46,37,39,36,35].includes(keyCode)) return true;
    return /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]$/.test(key) ? true : (event.preventDefault(), false);
  }
</script>
</body>
</html>
