<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Producto - Juan del Sur</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{
background:#f1f1f1;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:40px 20px;
font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
}

.card-crear{
width:100%;
max-width:550px;
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 4px 20px rgba(0,0,0,0.04);
border: 1px solid #eef2f5;
}

.card-header-custom{
padding:18px 24px;
background:#343a40;
display:flex;
justify-content:space-between;
align-items:center;
border:none;
}

.card-header-custom h5{
margin:0;
font-weight:bold;
color:#ffffff;
font-size:1.1rem;
letter-spacing:0.3px;
}

.card-body{
padding:30px;
}

.form-label {
font-weight: 600;
color: #495057;
font-size: 0.88rem;
margin-bottom: 6px;
text-transform: uppercase;
letter-spacing: 0.3px;
}

.form-control,
.form-select{
border-radius:8px;
padding:11px 14px;
border: 1px solid #ced4da;
color: #212529;
font-size: 0.95rem;
background-color: #fff;
transition: all 0.2s ease;
}

.form-control:focus,
.form-select:focus {
border-color: #0d6efd;
box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
}

.codigo-generado{
background-color: #f8f9fa !important;
color: #4b5563;
font-weight: 600;
border-color: #e3e6ea;
}

.info-box{
background-color: #f8f9fa;
padding: 14px 18px;
border-radius: 8px;
border: 1px dashed #dee2e6;
font-size: 0.92rem;
color: #495057;
}

.btn-crear{
width:100%;
border:none;
padding:12px;
border-radius:8px;
background:#0d6efd;
color:white;
font-weight:600;
transition: all 0.2s ease;
box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
}

.btn-crear:hover{
background:#0b5ed7;
}

.btn-cancelar{
display:block;
margin-top:12px;
text-decoration:none;
text-align:center;
padding:12px;
border-radius:8px;
background:#6c757d;
color:white;
font-weight:600;
transition: all 0.2s ease;
}

.btn-cancelar:hover{
background:#5c636a;
color:white;
}

.btn-volver-top {
background-color: rgba(255, 255, 255, 0.12);
color: #ffffff;
border: 1px solid rgba(255, 255, 255, 0.2);
padding: 7px 14px;
border-radius: 6px;
font-size: 0.85rem;
font-weight: 600;
text-decoration: none;
transition: all 0.2s;
}

.btn-volver-top:hover {
background-color: rgba(255, 255, 255, 0.22);
color: #ffffff;
}

/* Adicional para mensajes de error en vivo */
.duplicate-warning {
    font-size: 0.8rem;
    margin-top: 5px;
    display: none;
}
.duplicate-warning i {
    margin-right: 4px;
}
</style>

</head>

<body>

<div class="card-crear">

<div class="card-header-custom">

<h5>
<i class="fas fa-plus-circle me-2 text-primary"></i>
Crear Producto
</h5>

<a href="{% url 'productos:inventario' %}" class="btn-volver-top">
<i class="fas fa-arrow-left me-1"></i> Volver
</a>

</div>

<div class="card-body">

<!-- =============================================== -->
<!-- BLOQUE PARA MOSTRAR MENSAJES DE DJANGO (ALERTAS) -->
<!-- =============================================== -->
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
            <i class="fas {% if message.tags == 'error' %}fa-exclamation-triangle{% elif message.tags == 'success' %}fa-check-circle{% else %}fa-info-circle{% endif %} me-2"></i>
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
{% endif %}

<form method="POST" id="productoForm">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">
Código
</label>

<input
type="text"
name="codProducto"
id="codProducto"
class="form-control codigo-generado"
readonly>

<div class="form-text text-muted" style="font-size: 0.75rem;">
Se genera automáticamente
</div>

</div>


<div class="mb-3">

<label class="form-label">
Nombre
</label>

<input
type="text"
name="nomProducto"
id="prodNombre"
class="form-control"
placeholder="Ej. Coca Cola 2L"
required>

<!-- advertencia en vivo -->
<div id="nombreWarning" class="duplicate-warning text-danger">
    <i class="fas fa-exclamation-circle"></i> Ya existe un producto activo con este nombre y esta presentación.
</div>

</div>


<div class="mb-3">

<label class="form-label">
Categoría
</label>

<select
name="categoria"
class="form-select"
required>

<option value="">
Seleccione...
</option>

{% for cat in categorias %}

<option value="{{cat.id}}">
{{cat.nomCategoria}}
</option>

{% endfor %}

</select>

</div>


<div class="mb-3">

<label class="form-label">
Presentación
</label>

<select name="presentacion" id="presentacion" class="form-select">
    <option value="">Seleccione...</option>
    {% for p in presentaciones %}
        <option value="{{ p.id }}">
            {{ p.cantidad|floatformat:0 }} {{ p.medida.abreviatura|default:"(sin medida)" }}
        </option>
    {% endfor %}
</select>

</div>


<div class="mb-3">

<label class="form-label">
Precio Compra (Bs)
</label>

<input
type="number"
step="0.01"
name="precioCompra"
id="precioCompra"
class="form-control"
placeholder="0.00"
required>

</div>


<div class="mb-4">

<label class="form-label">
Precio Venta (Bs)
</label>

<input
type="number"
step="0.01"
name="precioVenta"
id="precioVenta"
class="form-control"
placeholder="0.00"
required>

</div>


<div class="info-box">

<i class="fas fa-eye me-1 text-primary"></i>
<strong>Resumen:</strong>
<span id="preview" class="text-secondary">
---
</span>

</div>

<br>

<button
type="submit"
class="btn-crear">
<i class="fas fa-save me-2"></i> Guardar Producto
</button>

<a
href="{% url 'productos:inventario' %}"
class="btn-cancelar">
<i class="fas fa-times me-2"></i> Cancelar
</a>

</form>

</div>

</div>

<script>
// abreviar nombre para código
function abreviarNombre(nombre) {
    nombre = nombre.toUpperCase();
    return nombre.replace(/[^A-Z0-9]/g, '').substring(0, 4);
}

function generarCodigo() {
    let nombre = document.getElementById('prodNombre').value;
    let presentacionSelect = document.getElementById('presentacion');
    
    if (!nombre) {
        document.getElementById('codProducto').value = '';
        return;
    }
    
    let nombreAbrev = abreviarNombre(nombre);
    let abrev = 'GEN';
    
    if (presentacionSelect.value) {
        let textoOpcion = presentacionSelect.options[presentacionSelect.selectedIndex].text;
        let partes = textoOpcion.trim().split(' ');
        abrev = partes[partes.length - 1];
    }
    
    let codigo = `${nombreAbrev}_${abrev}_000`;
    document.getElementById('codProducto').value = codigo;
    document.getElementById('preview').innerHTML = nombre;
}

// ====================================================
// VERIFICACIÓN EN VIVO: ¿nombre + presentación ya existe?
// ====================================================
async function verificarDuplicado() {
    const nombre = document.getElementById('prodNombre').value.trim();
    const presentacionId = document.getElementById('presentacion').value;
    const warningDiv = document.getElementById('nombreWarning');
    const submitBtn = document.querySelector('.btn-crear');
    
    if (!nombre) {
        warningDiv.style.display = 'none';
        submitBtn.disabled = false;
        return;
    }
    
    try {
        // Llamada a la API que crearemos abajo
        const response = await fetch(`/productos/verificar-duplicado/?nombre=${encodeURIComponent(nombre)}&presentacion=${presentacionId || ''}`);
        const data = await response.json();
        
        if (data.existe) {
            warningDiv.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.6';
        } else {
            warningDiv.style.display = 'none';
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
        }
    } catch (error) {
        console.error('Error al verificar duplicado:', error);
        // Si falla la API, permitimos enviar (el backend ya lo valida)
        warningDiv.style.display = 'none';
        submitBtn.disabled = false;
    }
}

// Eventos para verificar en tiempo real
document.getElementById('prodNombre').addEventListener('input', () => {
    generarCodigo();
    verificarDuplicado();
});
document.getElementById('presentacion').addEventListener('change', () => {
    generarCodigo();
    verificarDuplicado();
});

// Validación precio venta > precio compra
document.getElementById('productoForm').addEventListener('submit', function(e) {
    let compra = parseFloat(document.getElementById('precioCompra').value);
    let venta = parseFloat(document.getElementById('precioVenta').value);
    
    if (venta <= compra) {
        e.preventDefault();
        alert('El precio de venta debe ser mayor al precio de compra');
    }
});

// Inicializar verificación al cargar
document.addEventListener('DOMContentLoaded', verificarDuplicado);
</script>

</body>
</html>
