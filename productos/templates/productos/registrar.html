<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Producto - Juan del Sur</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>

body{
background:#2B2D33;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
font-family:'Segoe UI';
}

.card-crear{
width:100%;
max-width:550px;
background:#EAEAEA;
border-radius:30px;
overflow:hidden;
box-shadow:0 25px 50px -12px rgba(0,0,0,.5);
}

.card-header{
padding:20px;
background:#E0E0E0;
border-bottom:3px solid #0671B8;
display:flex;
justify-content:space-between;
align-items:center;
}

.card-body{
padding:30px;
}

.form-control,
.form-select{
border-radius:15px;
padding:10px;
}

.btn-crear{
width:100%;
border:none;
padding:12px;
border-radius:30px;
background:#0671B8;
color:white;
font-weight:bold;
}

.btn-crear:hover{
background:#055A9A;
}

.btn-cancelar{
display:block;
margin-top:10px;
text-decoration:none;
text-align:center;
padding:12px;
border-radius:30px;
background:#6C757D;
color:white;
}

.codigo-generado{
font-weight:bold;
background:#e9ecef;
}

.info{
padding:10px;
background:#e9ecef;
border-radius:10px;
font-size:14px;
}

</style>

</head>

<body>

<div class="card-crear">

<div class="card-header">

<h4>
<i class="fas fa-plus-circle"></i>
Crear Producto
</h4>

<a href="{% url 'productos:inventario' %}"
class="btn btn-secondary">

Volver

</a>

</div>

<div class="card-body">

<form method="POST" id="productoForm">

{% csrf_token %}

<!-- CODIGO -->

<div class="mb-3">

<label class="form-label">

Código

</label>

<input
type="text"
name="codProducto"
id="codProducto"
class="form-control codigo-generado"
readonly>

<small>
Se genera automáticamente
</small>

</div>


<!-- NOMBRE -->

<div class="mb-3">

<label class="form-label">

Nombre

</label>

<input
type="text"
name="nomProducto"
id="prodNombre"
class="form-control"
required>

</div>


<!-- CATEGORIA -->

<div class="mb-3">

<label class="form-label">

Categoría

</label>

<select
name="categoria"
class="form-select"
required>

<option value="">
Seleccione
</option>

{% for cat in categorias %}

<option value="{{cat.id}}">
{{cat.nomCategoria}}
</option>

{% endfor %}

</select>

</div>


<!-- PRESENTACION -->

<div class="mb-3">

<label class="form-label">

Presentación

</label>

<select
name="presentacion"
id="presentacion"
class="form-select">

<option value="">

Seleccione

</option>

{% for p in presentaciones %}

<option value="{{p.id}}">

{{p.cantidad}}
{{p.unidad_medida.abreviatura}}

</option>

{% endfor %}

</select>

</div>


<!-- UNIDAD VENTA -->

<div class="mb-3">

<label class="form-label">

Unidad Venta

</label>

<select
name="unidad_venta"
id="unidadVenta"
class="form-select"
required>

<option value="">

Seleccione

</option>

{% for uv in unidades_venta %}

<option value="{{uv.id}}">

{{uv.nombre}}
({{uv.abreviatura}})

</option>

{% endfor %}

</select>

</div>


<!-- PRECIO COMPRA -->

<div class="mb-3">

<label class="form-label">

Precio Compra

</label>

<input
type="number"
step="0.01"
name="precioCompra"
id="precioCompra"
class="form-control"
required>

</div>


<!-- PRECIO VENTA -->

<div class="mb-3">

<label class="form-label">

Precio Venta

</label>

<input
type="number"
step="0.01"
name="precioVenta"
id="precioVenta"
class="form-control"
required>

</div>


<div class="info">

<i class="fas fa-eye"></i>

Resumen:

<span id="preview">

---

</span>

</div>

<br>

<button
type="submit"
class="btn-crear">

Guardar Producto

</button>

<a
href="{% url 'productos:inventario' %}"
class="btn-cancelar">

Cancelar

</a>

</form>

</div>

</div>

<script>

function abreviarNombre(nombre){

nombre=nombre.toUpperCase()

return nombre
.replace(/[^A-Z0-9]/g,'')
.substring(0,4)

}


function generarCodigo(){

let nombre=
document.getElementById(
'prodNombre'
).value

let unidad=
document.getElementById(
'unidadVenta'
)

if(!nombre){

document.getElementById(
'codProducto'
).value=''

return

}

let nombreAbrev=
abreviarNombre(nombre)

let uv='GEN'

if(unidad.value){

let texto=
unidad.options[
unidad.selectedIndex
].text

let match=
texto.match(/\((.*?)\)/)

uv=match?
match[1]:
'GEN'

}

let codigo=

`${nombreAbrev}_${uv}_000`

document.getElementById(
'codProducto'
).value=
codigo


document.getElementById(
'preview'
).innerHTML=

nombre

}


document.getElementById(
'prodNombre'
).addEventListener(
'input',
generarCodigo
)

document.getElementById(
'unidadVenta'
).addEventListener(
'change',
generarCodigo
)


document.getElementById(
'productoForm'
).addEventListener(
'submit',
function(e){

let compra=
parseFloat(
document.getElementById(
'precioCompra'
).value
)

let venta=
parseFloat(
document.getElementById(
'precioVenta'
).value
)

if(venta<=compra){

e.preventDefault()

alert(
'El precio de venta debe ser mayor al precio compra'
)

}

}
)

</script>

</body>
</html>
