<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Unidad de Medida - Juan del Sur</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* ========== FONDO CLARO Y CENTRADO ABSOLUTO ========== */
        body { 
            background: #f4f6f9; /* Fondo gris claro muy limpio */
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            padding: 0; 
            color: #1f1f1f; /* Texto negro principal */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* ========== TARJETA DE ADVERTENCIA BLANCA ========== */
        .card-eliminar {
            width: 440px;
            max-width: 95%;
            background: #ffffff; /* Fondo blanco para el contenedor */
            border: 1px solid #e0e4ec;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            text-align: center;
        }
        
        .card-header-custom {
            background: #f8f9fa; /* Encabezado gris suave de contraste */
            border-bottom: 1px solid #e0e4ec;
            padding: 22px 24px;
        }

        .card-header-custom h4 {
            color: #1f1f1f; /* Texto negro */
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
        }
        
        .card-body-custom {
            padding: 30px 24px;
        }

        /* Icono de advertencia grande */
        .warning-icon {
            font-size: 3rem;
            color: #dc3545;
            margin-bottom: 16px;
        }

        /* Texto de confirmación */
        .alerta-texto {
            font-size: 1.05rem;
            color: #495057;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .nombre-unidad {
            font-weight: 700;
            color: #dc3545; /* Resalta el nombre en rojo peligro */
            background: #fdf2f2;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #facbce;
        }

        /* Botones de acción mas limpios */
        .btn-eliminar {
            background: #dc3545;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-eliminar:hover {
            background: #bb2d3b;
        }

        .btn-cancelar {
            background: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            margin-top: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #495057;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-cancelar:hover {
            background: #f8f9fa;
            color: #212529;
            border-color: #b5bbc1;
        }
    </style>
</head>

<body>

<div class="card-eliminar">

    <div class="card-header-custom">
        <h4>Confirmar Eliminación</h4>
    </div>

    <div class="card-body-custom">
        
        <!-- Icono de advertencia visual -->
        <div class="warning-icon">
            <i class="fas fa-exclamation-circle"></i>
        </div>

        <p class="alerta-texto">
            ¿Seguro que deseas eliminar permanentemente la unidad de medida 
            <span class="nombre-unidad">{{ unidad.nombre }}</span>? <br>
            <small class="text-muted">Esta acción no se puede deshacer.</small>
        </p>

        <!-- Formulario POST para Django -->
        <form method="POST">
            {% csrf_token %}
            <button class="btn-eliminar" type="submit">
                <i class="fas fa-trash-alt"></i> Sí, eliminar registro
            </button>
        </form>

        <a href="{% url 'unidadmedida:lista' %}" class="btn-cancelar">
            <i class="fas fa-times"></i> Cancelar y volver
        </a>

    </div>

</div>

</body>
</html>
