<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eliminar Unidad de Medida</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#2B2D33;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
font-family:'Segoe UI';
}

.card-crear{
width:420px;
background:#EAEAEA;
border-radius:28px;
overflow:hidden;
text-align:center;
}

.card-header{
background:#E0E0E0;
padding:20px 24px;
border-bottom:3px solid #DC3545;
}

.card-body{
padding:24px;
}

.btn-eliminar{
background:#DC3545;
border:none;
border-radius:40px;
padding:12px;
width:100%;
color:white;
font-weight:600;
}

.btn-cancelar{
background:#6C757D;
border:none;
border-radius:40px;
padding:12px;
width:100%;
margin-top:10px;
text-decoration:none;
display:inline-block;
text-align:center;
color:white;
}

.nombre{
font-weight:700;
color:#DC3545;
}
</style>
</head>

<body>

<div class="card-crear">

<div class="card-header">
<h4>Eliminar Unidad de Medida</h4>
</div>

<div class="card-body">

<p>
¿Seguro que deseas eliminar la unidad de medida
<span class="nombre">{{ unidad.nombre }}</span>?
</p>

<form method="POST">
{% csrf_token %}

<button class="btn-eliminar">
Sí, eliminar
</button>

</form>

<a href="{% url 'unidadmedida:lista' %}" class="btn-cancelar">
Cancelar
</a>

</div>

</div>

</body>
</html>
