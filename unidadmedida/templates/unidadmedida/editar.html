<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Unidad de Medida - Juan del Sur</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* ========== FONDO CLARO Y CENTRADO ABSOLUTO ========== */
        body { 
            background: #f4f6f9; /* Fondo gris claro muy limpio */
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            padding: 0; 
            color: #1f1f1f; /* Texto negro principal */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* ========== TARJETA DE FORMULARIO BLANCA ========== */
        .card-editar {
            width: 460px;
            max-width: 95%;
            background: #ffffff; /* Fondo blanco para el contenedor */
            border: 1px solid #e0e4ec;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            margin: 20px 0;
        }
        
        .card-header-custom {
            background: #f8f9fa; /* Encabezado gris suave de contraste */
            border-bottom: 1px solid #e0e4ec;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header-custom h4 {
            color: #1f1f1f; /* Texto negro */
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
            flex: 1;
        }

        .btn-back {
            background: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: 600;
            color: #495057;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: #f8f9fa;
            color: #212529;
            border-color: #b5bbc1;
        }
        
        .card-body-custom {
            padding: 24px;
        }

        /* Campos de Formulario */
        .form-label {
            font-weight: 600;
            color: #1f1f1f; /* Etiquetas en negro */
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid #ced4da;
            background-color: #ffffff;
            color: #212529;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #FFC107;
            box-shadow: 0 0 0 3px rgba(255,193,7,0.2);
            background-color: #ffffff;
            color: #212529;
        }

        /* Campo de la abreviatura automática */
        .abreviatura-auto {
            background: #f1f3f5 !important;
            color: #495057;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: not-allowed;
            border-color: #dee2e6;
        }

        /* Botones de acción */
        .btn-actualizar {
            background: #FFC107;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            color: #111111; /* Texto oscuro para buen contraste con amarillo */
            width: 100%;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-actualizar:hover {
            background: #e0a800;
        }

        .btn-cancelar {
            background: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            margin-top: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #495057;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-cancelar:hover {
            background: #f8f9fa;
            color: #212529;
            border-color: #b5bbc1;
        }

        .is-invalid {
            border-color: #dc3545 !important;
        }

        .invalid-feedback {
            font-size: 0.825rem;
            margin-top: 5px;
            color: #dc3545;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card-editar">
    <div class="card-header-custom">
        <a href="{% url 'unidadmedida:lista' %}" class="btn-back" title="Volver">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h4>
            <i class="fas fa-edit me-2" style="color: #FFC107;"></i> Editar Unidad de Medida
        </h4>
    </div>

    <div class="card-body-custom">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius:8px;">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" id="editarForm">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-tag me-1 text-muted"></i> Nombre de la Unidad
                </label>
                <input type="text"
                       name="nombre"
                       id="nombre"
                       class="form-control"
                       value="{{ unidad.nombre }}"
                       required
                       autocomplete="off">
                <div class="invalid-feedback" id="nombreError">
                    Solo se permiten letras, espacios y guiones.
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="fas fa-font me-1 text-muted"></i> Abreviatura Generada
                </label>
                <input type="text"
                       name="abreviatura"
                       id="abreviatura"
                       class="form-control abreviatura-auto"
                       value="{{ unidad.abreviatura }}"
                       readonly
                       required>
            </div>

            <button class="btn-actualizar" type="submit">
                <i class="fas fa-save"></i> Actualizar Unidad
            </button>

            <a href="{% url 'unidadmedida:lista' %}" class="btn-cancelar">
                <i class="fas fa-times"></i> Cancelar Cambios
            </a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const nombreInput = document.getElementById('nombre');
const abreviaturaInput = document.getElementById('abreviatura');
const form = document.getElementById('editarForm');
const nombreError = document.getElementById('nombreError');

function soloLetras(texto) {
    if (!texto) return false;
    const regex = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s\-]+$/;
    return regex.test(texto);
}

function generarAbreviatura(nombre) {
    if (!nombre || nombre.trim() === '') return '';
    
    nombre = nombre.toLowerCase().trim();
    
    const abreviaturas = {
        'kilogramo': 'kg', 'kilogramos': 'kg', 'kilo': 'kg', 'kilos': 'kg',
        'gramo': 'g', 'gramos': 'g', 'litro': 'lt', 'litros': 'lts',
        'mililitro': 'ml', 'mililitros': 'ml', 'unidad': 'und', 'unidades': 'und',
        'metro': 'm', 'metros': 'm', 'centimetro': 'cm', 'centimetros': 'cm',
        'centímetro': 'cm', 'centímetros': 'cm', 'caja': 'cj', 'cajas': 'cj',
        'paquete': 'pqt', 'paquetes': 'pqt', 'docena': 'doc', 'docenas': 'doc',
        'bolsa': 'bol', 'bolsas': 'bol', 'botella': 'bot', 'botellas': 'bot'
    };
    
    if (abreviaturas[nombre]) {
        return abreviaturas[nombre];
    }
    
    const palabras = nombre.split(/\s+/).filter(p => p.length > 0);
    
    if (palabras.length === 1) {
        let abrev = palabras[0];
        if (abrev.length <= 3) {
            return abrev.toUpperCase();
        }
        return abrev.substring(0, 3).toUpperCase();
    }
    
    const iniciales = palabras.map(p => p.charAt(0).toUpperCase()).join('');
    if (iniciales.length >= 2 && iniciales.length <= 4) {
        return iniciales;
    }
    
    return nombre.substring(0, 3).toUpperCase();
}

nombreInput.addEventListener('input', function() {
    const valor = this.value;
    
    if (valor && !soloLetras(valor)) {
        this.classList.add('is-invalid');
        nombreError.style.display = 'block';
    } else {
        this.classList.remove('is-invalid');
        nombreError.style.display = 'none';
    }
    
    const abrev = generarAbreviatura(valor);
    abreviaturaInput.value = abrev;
});

form.addEventListener('submit', function(e) {
    const valor = nombreInput.value;
    
    if (!soloLetras(valor)) {
        e.preventDefault();
        nombreInput.classList.add('is-invalid');
        nombreError.style.display = 'block';
        nombreInput.focus();
    }
});
</script>

</body>
</html>
