<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Unidades Eliminadas</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#2B2D33;
font-family:'Segoe UI';
}

.content-wrapper{
padding:20px;
}

.card-custom{
background:#EAEAEA;
border-radius:28px;
overflow:hidden;
}

.card-header{
background:#E0E0E0;
padding:20px 24px;
border-bottom:3px solid #6C757D;
}

.card-body{
padding:24px;
}

.table{
background:white;
border-radius:12px;
overflow:hidden;
}

.btn-recuperar{
background:#198754;
border:none;
border-radius:40px;
padding:6px 14px;
color:white;
font-weight:600;
text-decoration:none;
}

.btn-volver{
background:#6C757D;
border:none;
border-radius:40px;
padding:10px 18px;
color:white;
font-weight:600;
text-decoration:none;
}
</style>
</head>

<body>

<div class="content-wrapper">

<div class="card-custom">

<div class="card-header d-flex justify-content-between align-items-center">

<h4>
Unidades de Medida Eliminadas
</h4>

<a href="{% url 'unidadmedida:lista' %}" class="btn-volver">
Volver
</a>

</div>

<div class="card-body">

<div class="table-responsive">

<table class="table align-middle">

<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Abreviatura</th>
<th>Acción</th>
</tr>
</thead>

<tbody>

{% for unidad in unidades %}

<tr>

<td>{{ unidad.idUnidad }}</td>
<td>{{ unidad.nombre }}</td>
<td>{{ unidad.abreviatura }}</td>

<td>

<a href="{% url 'unidadmedida:recuperar' unidad.id %}" class="btn-recuperar">
Recuperar
</a>

</td>

</tr>

{% empty %}

<tr>
<td colspan="4" class="text-center">
No hay unidades eliminadas
</td>
</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</div>

</body>
</html>
