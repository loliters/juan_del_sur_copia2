<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crear Unidad de Medida</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
body {
  background:#2B2D33;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  font-family:'Segoe UI', system-ui, sans-serif;
  margin:0;
  padding:1rem;
}

.card-crear {
  width:420px;
  max-width:100%;
  background:#EAEAEA;
  border-radius:28px;
  box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);
  overflow:hidden;
}

.card-header {
  background:#E0E0E0;
  padding:20px 24px;
  border-bottom:3px solid #0671B8;
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-back {
  background:#6C757D;
  border:none;
  border-radius:40px;
  padding:6px 12px;
  font-weight:600;
  color:white;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:1rem;
  transition: background 0.2s;
}

.btn-back:hover {
  background:#545b62;
  color:white;
}

.card-header h4 {
  margin:0;
  font-weight:700;
  color:#1F1F1F;
  flex:1;
}

.card-body {
  padding:24px;
}

.form-label {
  font-weight:600;
  color:#1F1F1F;
  margin-bottom: 6px;
}

.form-control {
  border-radius:16px;
  padding:10px 14px;
  border:1px solid #ced4da;
}

.form-control:focus {
  border-color:#0671B8;
  box-shadow:0 0 0 3px rgba(6,113,184,0.2);
}

.btn-crear {
  background:#0671B8;
  border:none;
  border-radius:40px;
  padding:12px;
  font-weight:600;
  color:white;
  width:100%;
  transition: background 0.2s;
  margin-top: 8px;
}

.btn-crear:hover {
  background:#055A9A;
}

.abreviatura-auto {
  background:#f8f9fa;
  font-weight:600;
  cursor: default;
}

.is-invalid {
  border-color: #dc3545;
  background-image: none;
}

.invalid-feedback {
  font-size: 0.875rem;
  margin-top: 5px;
}
</style>
</head>
<body>

<div class="card-crear">

  <div class="card-header">
    <a href="{{ next|default:'javascript:history.back()' }}" class="btn-back">
      <i class="fas fa-arrow-left"></i>
    </a>
    <h4>
      <i class="fas fa-plus-circle me-2"></i> Nueva Unidad de Medida
    </h4>
  </div>

  <div class="card-body">

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius:12px;">
          <i class="fas fa-exclamation-triangle me-2"></i>
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" id="unidadForm">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">
          <i class="fas fa-tag me-1"></i> Nombre
        </label>
        <input type="text"
               id="nombre"
               name="nombre"
               class="form-control"
               placeholder="Ej: Kilogramos, Litros, Gramos"
               required autocomplete="off">
        <div class="invalid-feedback" id="nombreError">
          Solo se permiten letras, espacios y guiones.
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">
          <i class="fas fa-short-alt me-1"></i> Abreviatura
        </label>
        <input type="text"
               id="abreviatura"
               name="abreviatura"
               class="form-control abreviatura-auto"
               readonly
               required>
      </div>

      <button class="btn-crear" type="submit">
        <i class="fas fa-save me-2"></i>
        Guardar Unidad
      </button>

    </form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const nombreInput = document.getElementById('nombre');
const abreviaturaInput = document.getElementById('abreviatura');
const form = document.getElementById('unidadForm');
const nombreError = document.getElementById('nombreError');

// Función para validar solo letras
function soloLetras(texto) {
    if (!texto) return false;
    const regex = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s\-]+$/;
    return regex.test(texto);
}

// Función para generar abreviatura
function generarAbreviatura(nombre) {
    if (!nombre || nombre.trim() === '') return '';
    
    nombre = nombre.toLowerCase().trim();
    
    const abreviaturas = {
        'kilogramo': 'kg',
        'kilogramos': 'kg',
        'kilo': 'kg',
        'kilos': 'kg',
        'gramo': 'g',
        'gramos': 'g',
        'litro': 'lt',
        'litros': 'lts',
        'mililitro': 'ml',
        'mililitros': 'ml',
        'unidad': 'und',
        'unidades': 'und',
        'metro': 'm',
        'metros': 'm',
        'centimetro': 'cm',
        'centimetros': 'cm',
        'centímetro': 'cm',
        'centímetros': 'cm',
        'caja': 'cj',
        'cajas': 'cj',
        'paquete': 'pqt',
        'paquetes': 'pqt',
        'docena': 'doc',
        'docenas': 'doc',
        'bolsa': 'bol',
        'bolsas': 'bol',
        'botella': 'bot',
        'botellas': 'bot'
    };
    
    if (abreviaturas[nombre]) {
        return abreviaturas[nombre];
    }
    
    const palabras = nombre.split(/\s+/).filter(p => p.length > 0);
    
    if (palabras.length === 1) {
        let abrev = palabras[0];
        if (abrev.length <= 3) {
            return abrev.toUpperCase();
        }
        return abrev.substring(0, 3).toUpperCase();
    }
    
    const iniciales = palabras.map(p => p.charAt(0).toUpperCase()).join('');
    if (iniciales.length >= 2 && iniciales.length <= 4) {
        return iniciales;
    }
    
    return nombre.substring(0, 3).toUpperCase();
}

nombreInput.addEventListener('input', function() {
    const valor = this.value;
    
    if (!soloLetras(valor)) {
        this.classList.add('is-invalid');
        nombreError.style.display = 'block';
    } else {
        this.classList.remove('is-invalid');
        nombreError.style.display = 'none';
    }
    
    const abrev = generarAbreviatura(valor);
    abreviaturaInput.value = abrev;
});

form.addEventListener('submit', function(e) {
    const valor = nombreInput.value;
    
    if (!soloLetras(valor)) {
        e.preventDefault();
        nombreInput.classList.add('is-invalid');
        nombreError.style.display = 'block';
        nombreInput.focus();
    }
});

if (nombreInput.value) {
    abreviaturaInput.value = generarAbreviatura(nombreInput.value);
}
</script>

</body>
</html>
