<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Productos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f1f1f1;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  height: 100vh;
  background: #2f2f2f;
  color: white;
  position: fixed;
  padding: 20px;
  overflow-y: auto;
}

.sidebar h5 {
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid #555;
}

.sidebar a {
  display: flex;
  align-items: center;
  gap: 10px;
  color: white;
  text-decoration: none;
  padding: 10px 12px;
  margin: 6px 0;
  border-radius: 8px;
}

.sidebar a:hover,
.sidebar a.active {
  background: #0d6efd;
}

.sidebar i { width: 20px; }

/* MAIN */
.main {
  margin-left: 260px;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

/* FILTROS */
.filters {
  background: white;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  align-items: end;
  margin-bottom: 20px;
}

.field {
  display: flex;
  flex-direction: column;
}

.field label {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 3px;
}

select {
  padding: 6px;
  border-radius: 6px;
  border: 1px solid #ccc;
  min-width: 120px;
}

/* BOTONES */
.btn-group-custom {
  display: flex;
  gap: 10px;
}

.btn {
  border-radius: 6px;
}

/* CHART */
.chart-box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  height: 450px;
}

/* PRINT */
@media print {
  .sidebar,
  .filters,
  .btn-group-custom {
    display: none !important;
  }

  .main {
    margin: 0;
  }

  body {
    background: white;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h5><i class="fas fa-tachometer-alt"></i> Dashboard</h5>

  <a href="{% url 'dashboard_admin' %}"><i class="fas fa-home"></i> Inicio</a>
  <a href="{% url 'productos:inventario' %}"><i class="fas fa-box"></i> Productos</a>
  <a href="{% url 'categorias:lista' %}"><i class="fas fa-tags"></i> Categorías</a>
  <a href="{% url 'compras:ver_compras' %}"><i class="fas fa-shopping-cart"></i> Compras</a>
  <a href="{% url 'ventas:ver_ventas' %}"><i class="fas fa-cash-register"></i> Ventas</a>

  <hr>

  <a class="active" href="{% url 'estadisticas:top_productos' %}">
    <i class="fas fa-chart-bar"></i> Top Productos
  </a>

  <a href="{% url 'estadisticas:prediccion' %}">
    <i class="fas fa-chart-line"></i> Predicción
  </a>

  <hr>

  <a href="{% url 'logout' %}">
    <i class="fas fa-sign-out-alt"></i> Cerrar sesión
  </a>
</div>

<!-- MAIN -->
<div class="main">

  <!-- HEADER -->
  <div class="header">
    <h3><i class="fas fa-chart-bar"></i> Top Productos</h3>

    <div class="btn-group-custom">
      <button class="btn btn-danger" onclick="window.print()">
        <i class="fas fa-file-pdf"></i> PDF
      </button>
    </div>
  </div>

  <!-- FILTROS -->
  <form method="GET">
    <div class="filters">

      <div class="field">
        <label>Top</label>
        <select name="top">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </div>

      <div class="field">
        <label>Categoría</label>
        <select name="categoria">
          <option value="">Todas</option>
          {% for c in categorias %}
          <option value="{{ c.id }}">{{ c.nomCategoria }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label>Mes</label>
        <select name="mes">
          <option value="">Todos</option>
          <option value="1">Enero</option>
          <option value="2">Febrero</option>
          <option value="3">Marzo</option>
          <option value="4">Abril</option>
          <option value="5">Mayo</option>
          <option value="6">Junio</option>
          <option value="7">Julio</option>
          <option value="8">Agosto</option>
          <option value="9">Septiembre</option>
          <option value="10">Octubre</option>
          <option value="11">Noviembre</option>
          <option value="12">Diciembre</option>
        </select>
      </div>

      <button class="btn btn-primary">
        <i class="fas fa-search"></i> Filtrar
      </button>

    </div>
  </form>

  <!-- GRAFICO -->
  <div class="chart-box">
    <canvas id="topChart"></canvas>
  </div>

</div>

<script>
const ctx = document.getElementById('topChart');

new Chart(ctx, {
  type: 'bar',
  data: {
    labels: {{ productos_labels|safe }},
    datasets: [{
      label: 'Unidades Vendidas',
      data: {{ ventas_data|safe }},
      backgroundColor: '#0d6efd'
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false
  }
});
</script>

</body>
</html>
