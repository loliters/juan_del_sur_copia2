<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Productos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f1f1f1;
}

.sidebar {
  width: 260px;
  height: 100vh;
  background: #2f2f2f;
  color: white;
  position: fixed;
  padding: 20px;
  overflow-y: auto;
}

.sidebar h5 {
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid #555;
}

.sidebar a {
  display: flex;
  align-items: center;
  gap: 10px;
  color: white;
  text-decoration: none;
  padding: 10px 12px;
  margin: 6px 0;
  border-radius: 8px;
}

.sidebar a:hover,
.sidebar a.active {
  background: #0d6efd;
}

.sidebar i { width: 20px; }

.main {
  margin-left: 260px;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.filters {
  background: white;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  align-items: end;
  margin-bottom: 20px;
}

.field {
  display: flex;
  flex-direction: column;
}

.field label {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 3px;
}

select {
  padding: 6px;
  border-radius: 6px;
  border: 1px solid #ccc;
  min-width: 120px;
}

.chart-box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  height: 450px;
}

@media print {
  .sidebar,
  .filters,
  .btn-group-custom {
    display: none !important;
  }

  .main {
    margin: 0;
  }

  body {
    background: white;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h5><i class="fas fa-tachometer-alt"></i> Dashboard</h5>

  <a href="{% url 'dashboard_admin' %}"><i class="fas fa-home"></i> Inicio</a>
  <a href="{% url 'productos:inventario' %}"><i class="fas fa-box"></i> Productos</a>
  <a href="{% url 'categorias:lista' %}"><i class="fas fa-tags"></i> Categorías</a>
  <a href="{% url 'compras:ver_compras' %}"><i class="fas fa-shopping-cart"></i> Compras</a>
  <a href="{% url 'ventas:ver_ventas' %}"><i class="fas fa-cash-register"></i> Ventas</a>

  <hr>

  <a class="active" href="{% url 'estadisticas:top_productos' %}">
    <i class="fas fa-chart-bar"></i> Top Productos
  </a>

  <a href="{% url 'estadisticas:prediccion' %}">
    <i class="fas fa-chart-line"></i> Predicción
  </a>

  <hr>

  <a href="{% url 'logout' %}">
    <i class="fas fa-sign-out-alt"></i> Cerrar sesión
  </a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <h3><i class="fas fa-chart-bar"></i> Top Productos</h3>

    <button class="btn btn-danger" onclick="window.print()">
      <i class="fas fa-file-pdf"></i> PDF
    </button>
  </div>

  <!-- FILTROS -->
  <form method="GET">
    <div class="filters">

      <!-- TOP -->
      <div class="field">
        <label>Top</label>
        <select name="top">
          <option value="5" {% if top_n == 5 %}selected{% endif %}>5</option>
          <option value="10" {% if top_n == 10 %}selected{% endif %}>10</option>
          <option value="15" {% if top_n == 15 %}selected{% endif %}>15</option>
          <option value="20" {% if top_n == 20 %}selected{% endif %}>20</option>
        </select>
      </div>

      <!-- CATEGORÍA -->
      <div class="field">
        <label>Categoría</label>
        <select name="categoria">
          <option value="">Todas</option>
          {% for c in categorias %}
          <option value="{{ c.id }}"
            {% if categoria_id == c.id|stringformat:"s" %}selected{% endif %}>
            {{ c.nomCategoria }}
          </option>
          {% endfor %}
        </select>
      </div>

      <!-- MES -->
      <div class="field">
        <label>Mes</label>
        <select name="mes">
          <option value="">Todos</option>
          <option value="1" {% if mes == "1" %}selected{% endif %}>Enero</option>
          <option value="2" {% if mes == "2" %}selected{% endif %}>Febrero</option>
          <option value="3" {% if mes == "3" %}selected{% endif %}>Marzo</option>
          <option value="4" {% if mes == "4" %}selected{% endif %}>Abril</option>
          <option value="5" {% if mes == "5" %}selected{% endif %}>Mayo</option>
          <option value="6" {% if mes == "6" %}selected{% endif %}>Junio</option>
          <option value="7" {% if mes == "7" %}selected{% endif %}>Julio</option>
          <option value="8" {% if mes == "8" %}selected{% endif %}>Agosto</option>
          <option value="9" {% if mes == "9" %}selected{% endif %}>Septiembre</option>
          <option value="10" {% if mes == "10" %}selected{% endif %}>Octubre</option>
          <option value="11" {% if mes == "11" %}selected{% endif %}>Noviembre</option>
          <option value="12" {% if mes == "12" %}selected{% endif %}>Diciembre</option>
        </select>
      </div>

      <!-- AÑO -->
      <div class="field">
        <label>Año</label>
        <select name="anio">
          <option value="">Todos</option>
          {% for a in anos_disponibles %}
          <option value="{{ a }}"
            {% if anio == a|stringformat:"s" %}selected{% endif %}>
            {{ a }}
          </option>
          {% endfor %}
        </select>
      </div>

      <button class="btn btn-primary">
        <i class="fas fa-search"></i> Filtrar
      </button>

    </div>
  </form>

  <!-- GRAFICO -->
  <div class="chart-box">
    <canvas id="topChart"></canvas>
  </div>

</div>

<script>
const labels = JSON.parse('{{ productos_labels|escapejs }}');
const data = JSON.parse('{{ ventas_data|escapejs }}');

const ctx = document.getElementById('topChart');

new Chart(ctx, {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: 'Unidades Vendidas',
      data: data,
      backgroundColor: '#0d6efd'
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false
  }
});
</script>

</body>
</html>
